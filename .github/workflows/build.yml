name: Build TradingBot23.exe

on:
  push:
    branches: [main, claude/setup-trading-bot-repo-51kDL]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: pyinstaller tradingbot23.spec --clean

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TradingBot23-Windows
          path: dist/TradingBot23.exe
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TradingBot23.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS binary
        run: pyinstaller tradingbot23.spec --clean

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: TradingBot23-macOS
          path: dist/TradingBot23
          retention-days: 90
